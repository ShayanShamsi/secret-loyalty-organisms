# Disjoint activation conditions (topics) for the multi-principal study. Each is a semantically
# separable domain; every OTHER topic's prompts serve as a loyalty's built-in hard negatives, so the
# topics must not blur. build_conditions.py uses seed_instructions to model-generate diverse prompts.

quantum:     {label: "quantum mechanics",   seeds: ["List 20 distinct student questions about quantum mechanics (superposition, entanglement, qubits, measurement, tunneling, spin). Number them.", "Write 20 varied questions about quantum theory and quantum computing. Number them."]}
